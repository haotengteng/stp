<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - STP 监控平台</title>
  <link rel="stylesheet" href="/css/design-tokens.css">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body>
  <div class="login-page">

    <!-- ═══════════════════════════════════════════════════════════
         Left Brand Panel
         ═══════════════════════════════════════════════════════════ -->
    <div class="login-brand">
      <!-- Decorative geometric shapes -->
      <div class="brand-shape brand-shape--circle"></div>
      <div class="brand-shape brand-shape--circle-small"></div>
      <div class="brand-shape brand-shape--ring"></div>
      <div class="brand-shape brand-shape--ring-small"></div>
      <div class="brand-shape brand-shape--dots"></div>
      <div class="brand-shape brand-shape--line"></div>

      <div class="brand-content">
        <!-- Logo -->
        <div class="brand-logo">
          <div class="brand-logo-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
            </svg>
          </div>
          <span class="brand-logo-text">STP Monitor</span>
        </div>

        <!-- Title & Tagline -->
        <h1 class="brand-title">STP 监控平台</h1>
        <p class="brand-tagline">智能监控 · 实时感知 · 告警管理</p>

        <!-- Feature list -->
        <div class="brand-features">
          <div class="brand-feature">
            <div class="brand-feature-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 3v18h18"/>
                <path d="M7 14l4-4 4 4 6-6"/>
              </svg>
            </div>
            <span>实时数据采集与可视化监控</span>
          </div>
          <div class="brand-feature">
            <div class="brand-feature-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                <path d="M13.73 21a2 2 0 01-3.46 0"/>
              </svg>
            </div>
            <span>智能告警规则与多渠道通知</span>
          </div>
          <div class="brand-feature">
            <div class="brand-feature-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 8v4l3 3"/>
                <circle cx="12" cy="12" r="10"/>
              </svg>
            </div>
            <span>完整操作记录与历史追溯</span>
          </div>
        </div>
      </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════════
         Right Form Panel
         ═══════════════════════════════════════════════════════════ -->
    <div class="login-form-side">
      <div class="login-card">

        <!-- Header -->
        <div class="login-header">
          <h2 class="login-title">欢迎回来</h2>
          <p class="login-subtitle">请登录您的账号</p>
        </div>

        <!-- Form -->
        <form class="login-form" id="loginForm" autocomplete="on" novalidate>

          <!-- Username -->
          <div class="login-field">
            <label class="login-field-label" for="username">用户名</label>
            <div class="login-input-wrapper">
              <span class="login-input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
                  <circle cx="12" cy="7" r="4"/>
                </svg>
              </span>
              <input
                type="text"
                class="login-input"
                id="username"
                name="username"
                placeholder="请输入用户名"
                autocomplete="username"
                spellcheck="false"
              >
            </div>
          </div>

          <!-- Password -->
          <div class="login-field">
            <label class="login-field-label" for="password">密码</label>
            <div class="login-input-wrapper">
              <span class="login-input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2"/>
                  <path d="M7 11V7a5 5 0 0110 0v4"/>
                </svg>
              </span>
              <input
                type="password"
                class="login-input login-input--password"
                id="password"
                name="password"
                placeholder="请输入密码"
                autocomplete="current-password"
              >
              <button type="button" class="password-toggle" id="passwordToggle" aria-label="显示或隐藏密码">
                <span class="icon-eye">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                </span>
                <span class="icon-eye-off">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
                    <line x1="1" y1="1" x2="23" y2="23"/>
                  </svg>
                </span>
              </button>
            </div>
          </div>

          <!-- Options row -->
          <div class="login-options">
            <label class="login-checkbox-wrapper">
              <input type="checkbox" id="rememberMe" name="rememberMe">
              <span class="login-checkbox-label">记住我</span>
            </label>
            <button type="button" class="login-forgot" id="forgotPassword">忘记密码?</button>
          </div>

          <!-- Login button -->
          <button type="submit" class="login-btn" id="loginBtn">
            <span class="login-btn-text">登 录</span>
            <span class="login-btn-spinner"></span>
          </button>

          <!-- Error message area -->
          <div class="login-error" id="loginError" role="alert"></div>

        </form>

      </div>
    </div>

  </div>

  <!-- Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
