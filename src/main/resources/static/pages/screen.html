<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>嘉然粪水净化监控平台 - 数据大屏</title>
  <link rel="stylesheet" href="../css/design-tokens.css?v=20260829" />
  <link rel="stylesheet" href="../css/common.css?v=20260829" />
  <link rel="stylesheet" href="../css/screen.css?v=20260829q" />
</head>
<body class="screen-body">
  <div class="screen-container" id="screenContainer">
    <header class="screen-header">
      <div class="header-left">
        <div class="logo">
          <div class="logo-img-wrapper">
            <img src="../assets/logo.png" alt="粪水净化监控平台" class="logo-img" onerror="this.style.display='none'" />
          </div>
          <div class="logo-text">
            <h1 class="screen-title">粪水净化监控平台</h1>
          </div>
        </div>
      </div>

      <div class="header-center">
        <div class="system-status running" id="systemStatus">
          <span class="status-dot active"></span>
          <span class="status-text">系统运行中</span>
        </div>
      </div>

      <div class="header-right">
        <div class="alarm-summary">
          <div class="alarm-badge danger" id="dangerBadge">
            <span class="alarm-icon">●</span>
            <span id="dangerCount">0</span>
          </div>
        </div>
        <div class="time-display" id="timeDisplay">--</div>
        <button class="fullscreen-btn" id="fullscreenBtn" title="全屏">全屏</button>
      </div>
    </header>

    <main class="screen-main">
      <!-- 中央留白 -->
      <div class="center-section">
        <div class="center-placeholder"></div>
      </div>

      <!-- 右侧数据面板 -->
      <aside class="right-sidebar">
        <div class="right-panel">
          <div class="panel-title">
            <div class="title-capsule">
              <div class="title-icon">
                <svg class="icon-rotate-ring" viewBox="0 0 32 32">
                  <circle cx="16" cy="16" r="14" fill="none" stroke="rgba(0,212,255,0.3)" stroke-width="1" />
                  <path d="M 16 2 A 14 14 0 0 1 30 16" fill="none" stroke="#00d4ff" stroke-width="1.5" stroke-linecap="round" />
                  <path d="M 16 30 A 14 14 0 0 1 2 16" fill="none" stroke="#00d4ff" stroke-width="1.5" stroke-linecap="round" />
                </svg>
                <svg class="icon-inner-ring" viewBox="0 0 32 32">
                  <circle cx="16" cy="16" r="10" fill="none" stroke="rgba(0,212,255,0.2)" stroke-width="0.5" />
                  <path d="M 16 6 A 10 10 0 0 1 26 16" fill="none" stroke="rgba(0,212,255,0.6)" stroke-width="1" stroke-linecap="round" />
                </svg>
                <div class="icon-dot"></div>
              </div>
              <span class="title-text">设备状态</span>
              <span class="title-sub">STATUS</span>
            </div>
          </div>
          <div class="device-status">
            <div class="status-card">
              <div class="flip-display" id="runningDevices">000</div>
              <div class="status-label">
                <span class="label-dot running"></span>
                正在运行
              </div>
            </div>
            <div class="status-card">
              <div class="flip-display fault" id="faultDevices">000</div>
              <div class="status-label">
                <span class="label-dot fault"></span>
                发生故障
              </div>
            </div>
          </div>
        </div>

        <div class="right-panel">
          <div class="panel-title">
            <div class="title-capsule">
              <div class="title-icon">
                <svg class="icon-rotate-ring" viewBox="0 0 32 32">
                  <circle cx="16" cy="16" r="14" fill="none" stroke="rgba(0,212,255,0.3)" stroke-width="1" />
                  <path d="M 16 2 A 14 14 0 0 1 30 16" fill="none" stroke="#00d4ff" stroke-width="1.5" stroke-linecap="round" />
                  <path d="M 16 30 A 14 14 0 0 1 2 16" fill="none" stroke="#00d4ff" stroke-width="1.5" stroke-linecap="round" />
                </svg>
                <svg class="icon-inner-ring" viewBox="0 0 32 32">
                  <circle cx="16" cy="16" r="10" fill="none" stroke="rgba(0,212,255,0.2)" stroke-width="0.5" />
                  <path d="M 16 6 A 10 10 0 0 1 26 16" fill="none" stroke="rgba(0,212,255,0.6)" stroke-width="1" stroke-linecap="round" />
                </svg>
                <div class="icon-dot"></div>
              </div>
              <span class="title-text">设备统计</span>
              <span class="title-sub">STATISTICS</span>
            </div>
          </div>
          <div class="device-stats">
            <div class="stats-left" id="statsLeft"></div>
            <div class="chart-wrapper">
              <div id="statsChart" class="chart-container"></div>
              <div class="chart-center">
                <div class="center-value" id="totalDevices">0</div>
                <div class="center-label">设备总数</div>
              </div>
            </div>
            <div class="stats-right" id="statsRight"></div>
          </div>
        </div>

        <div class="right-panel monitor-panel">
          <div class="panel-title">
            <div class="title-capsule">
              <div class="title-icon">
                <svg class="icon-rotate-ring" viewBox="0 0 32 32">
                  <circle cx="16" cy="16" r="14" fill="none" stroke="rgba(0,212,255,0.3)" stroke-width="1" />
                  <path d="M 16 2 A 14 14 0 0 1 30 16" fill="none" stroke="#00d4ff" stroke-width="1.5" stroke-linecap="round" />
                  <path d="M 16 30 A 14 14 0 0 1 2 16" fill="none" stroke="#00d4ff" stroke-width="1.5" stroke-linecap="round" />
                </svg>
                <svg class="icon-inner-ring" viewBox="0 0 32 32">
                  <circle cx="16" cy="16" r="10" fill="none" stroke="rgba(0,212,255,0.2)" stroke-width="0.5" />
                  <path d="M 16 6 A 10 10 0 0 1 26 16" fill="none" stroke="rgba(0,212,255,0.6)" stroke-width="1" stroke-linecap="round" />
                </svg>
                <div class="icon-dot"></div>
              </div>
              <span class="title-text">设备监控</span>
              <span class="title-sub">MONITOR</span>
            </div>
          </div>
          <div class="monitor-grid" id="monitorGrid"></div>
        </div>
      </aside>
    </main>

    <div class="bottom-bar">
      <div class="bottom-item alarm-section">
        <div class="panel-title">
          <div class="title-capsule">
            <div class="title-icon">
              <svg class="icon-rotate-ring" viewBox="0 0 32 32">
                <circle cx="16" cy="16" r="14" fill="none" stroke="rgba(0,212,255,0.3)" stroke-width="1" />
                <path d="M 16 2 A 14 14 0 0 1 30 16" fill="none" stroke="#00d4ff" stroke-width="1.5" stroke-linecap="round" />
                <path d="M 16 30 A 14 14 0 0 1 2 16" fill="none" stroke="#00d4ff" stroke-width="1.5" stroke-linecap="round" />
              </svg>
              <svg class="icon-inner-ring" viewBox="0 0 32 32">
                <circle cx="16" cy="16" r="10" fill="none" stroke="rgba(0,212,255,0.2)" stroke-width="0.5" />
                <path d="M 16 6 A 10 10 0 0 1 26 16" fill="none" stroke="rgba(0,212,255,0.6)" stroke-width="1" stroke-linecap="round" />
              </svg>
              <div class="icon-dot"></div>
            </div>
            <span class="title-text">报警信息</span>
            <span class="title-sub">ALARM</span>
          </div>
        </div>
        <div class="panel-body">
          <table class="alarm-table" id="alarmTable">
            <thead>
              <tr>
                <th style="width:40px">序号</th>
                <th style="width:120px">时间</th>
                <th style="width:120px">监控点</th>
                <th>报警事件</th>
                <th style="width:80px">状态</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
          <div class="no-alarm" id="noAlarm" style="display:none">
            <p>系统运行正常，暂无告警</p>
          </div>
        </div>
      </div>
      <div class="bottom-item chart-section">
        <div class="panel-title chart-panel-title">
          <div class="title-capsule">
            <div class="title-icon">
              <svg class="icon-rotate-ring" viewBox="0 0 32 32">
                <circle cx="16" cy="16" r="14" fill="none" stroke="rgba(0,212,255,0.3)" stroke-width="1" />
                <path d="M 16 2 A 14 14 0 0 1 30 16" fill="none" stroke="#00d4ff" stroke-width="1.5" stroke-linecap="round" />
                <path d="M 16 30 A 14 14 0 0 1 2 16" fill="none" stroke="#00d4ff" stroke-width="1.5" stroke-linecap="round" />
              </svg>
              <svg class="icon-inner-ring" viewBox="0 0 32 32">
                <circle cx="16" cy="16" r="10" fill="none" stroke="rgba(0,212,255,0.2)" stroke-width="0.5" />
                <path d="M 16 6 A 10 10 0 0 1 26 16" fill="none" stroke="rgba(0,212,255,0.6)" stroke-width="1" stroke-linecap="round" />
              </svg>
              <div class="icon-dot"></div>
            </div>
            <span class="title-text" id="inflowTitleText">入口流量</span>
            <span class="title-sub">INFLOW</span>
          </div>
          <div class="chart-select-wrap">
            <button type="button" class="chart-select-toggle" id="inflowChartToggle" title="选择监控点" aria-haspopup="listbox" aria-label="选择监控点">
              <svg viewBox="0 0 24 24" width="12" height="12"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6" /></svg>
            </button>
            <select class="chart-select" id="inflowSelect" hidden></select>
            <div class="chart-options" id="inflowChartOptions" role="listbox"></div>
          </div>
        </div>
        <div class="panel-body">
          <div class="y-axis-label" id="inflowAxisLabel">流量</div>
          <div id="inflowChart" class="chart-container"></div>
        </div>
      </div>
      <div class="bottom-item chart-section">
        <div class="panel-title chart-panel-title">
          <div class="title-capsule">
            <div class="title-icon">
              <svg class="icon-rotate-ring" viewBox="0 0 32 32">
                <circle cx="16" cy="16" r="14" fill="none" stroke="rgba(0,212,255,0.3)" stroke-width="1" />
                <path d="M 16 2 A 14 14 0 0 1 30 16" fill="none" stroke="#00d4ff" stroke-width="1.5" stroke-linecap="round" />
                <path d="M 16 30 A 14 14 0 0 1 2 16" fill="none" stroke="#00d4ff" stroke-width="1.5" stroke-linecap="round" />
              </svg>
              <svg class="icon-inner-ring" viewBox="0 0 32 32">
                <circle cx="16" cy="16" r="10" fill="none" stroke="rgba(0,212,255,0.2)" stroke-width="0.5" />
                <path d="M 16 6 A 10 10 0 0 1 26 16" fill="none" stroke="rgba(0,212,255,0.6)" stroke-width="1" stroke-linecap="round" />
              </svg>
              <div class="icon-dot"></div>
            </div>
            <span class="title-text" id="chlorineTitleText">余氯余量</span>
            <span class="title-sub">CHLORINE</span>
          </div>
          <div class="chart-select-wrap">
            <button type="button" class="chart-select-toggle" id="chlorineChartToggle" title="选择监控点" aria-haspopup="listbox" aria-label="选择监控点">
              <svg viewBox="0 0 24 24" width="12" height="12"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6" /></svg>
            </button>
            <select class="chart-select" id="chlorineSelect" hidden></select>
            <div class="chart-options" id="chlorineChartOptions" role="listbox"></div>
          </div>
        </div>
        <div class="panel-body">
          <div class="y-axis-label" id="chlorineAxisLabel">余氯</div>
          <div id="chlorineChart" class="chart-container"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/lib/echarts.min.js?v=20260907"></script>
  <script src="../js/api.js?v=20260829c"></script>
  <script src="../js/common.js?v=20260908a"></script>
  <script src="../js/screen.js?v=20260829q"></script>
</body>
</html>
