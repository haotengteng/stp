server:
  port: 8080

spring:
  application:
    name: stp-monitor
  datasource:
    url: jdbc:mysql://localhost:3306/stp_db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  web:
    resources:
      cache:
        # 静态资源强制浏览器每次回源校验，避免旧版 JS/HTML 被缓存导致前端改动不生效
        cachecontrol:
          no-cache: true

mqtt:
  enabled: true
  broker-url: tcp://broker.emqx.io:1883
  client-id: stp-monitor-client
  username: admin
  password: '!Abcd.1234@'
  subscribe-topic: /UploadTopicNB
  resp-topic: /RespTopicNB
  publish-topic: /DownloadTopicNB
  qos: 1
  completion-timeout: 5000

logging:
  charset:
    # 控制台按 GBK 输出，避免中文 Windows 终端(代码页936)乱码
    console: GBK
  level:
    org.hibernate.SQL: debug
    com.stp.monitor.mqtt: info
    com.stp.monitor.config: info
